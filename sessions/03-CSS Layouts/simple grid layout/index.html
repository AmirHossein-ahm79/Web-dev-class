<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Grid Practice</title>
  </head>

  <body>
    <div class="page">
      <header class="header">Header</header>

      <aside class="sidebar">Sidebar</aside>

      <main class="main">
        <section class="cards">
          <article class="card">Card 1</article>

          <article class="card">Card 2</article>

          <article class="card">Card 3</article>

          <article class="card">Card 4</article>
        </section>

        <section class="content">
          <article class="panel">Panel 1</article>

          <article class="panel">Panel 2</article>
        </section>

        <section class="widgets">
          <article class="widget">Widget 1</article>

          <article class="widget">Widget 2</article>

          <article class="widget">Widget 3</article>
        </section>

        <section class="items">
          <div class="item">Item 1</div>
          <div class="item">Item 2</div>
          <div class="item">Item 3</div>
          <div class="item">Item 4</div>
          <div class="item">Item 5</div>
          <div class="item">Item 6</div>
          <div class="item">Item 7</div>
          <div class="item">Item 8</div>
        </section>
      </main>

      <footer class="footer">Footer</footer>
    </div>
  </body>
</html>
